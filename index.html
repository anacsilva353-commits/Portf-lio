<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login do portfólio de Ana Clara.">
    <title>Login | Ana Clara</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="login-card">
        <h1>Login</h1>
      

        <form onsubmit="logar(); return false">
            <label for="login">Usuário</label>
            <input type="text" id="login" placeholder="seu@email.com" autocomplete="username" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" required>

          
            

            <div class="botoes">
                <button type="submit" class="btn-conectar">Conectar</button>
                <button type="button" class="btn-cancelar" onclick="cancelar()">Cancelar</button>
            </div>

        
            </div>
        </form>
    </main>

    <script src="login.js"></script>
</body>

</html>
